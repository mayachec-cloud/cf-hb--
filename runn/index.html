<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CITY RUSH — Endless Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #87ceeb; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; }
canvas { display: block; }

#loading-screen {
  position: fixed; inset: 0; z-index: 1000;
  background: linear-gradient(135deg, #ff9a56 0%, #ffcd69 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.5s;
}
#loading-screen.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 60px; height: 60px; border: 6px solid rgba(255,255,255,0.3);
  border-top-color: #fff; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen h2 { color: #fff; margin-top: 20px; font-size: 28px; letter-spacing: 3px; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }

#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 24px; pointer-events: none;
}
.hud-item {
  background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 16px; padding: 10px 20px;
  color: #fff; font-weight: 700; font-size: 18px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.3);
  display: flex; align-items: center; gap: 8px;
}
.coin-icon { width: 22px; height: 22px; background: #ffd700; border-radius: 50%; border: 2px solid #e6a800; box-shadow: 0 0 8px rgba(255,215,0,0.6); }

#overlay {
  position: fixed; inset: 0; z-index: 100;
  background: linear-gradient(135deg, rgba(255,154,86,0.92) 0%, rgba(255,205,105,0.92) 100%);
  backdrop-filter: blur(4px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.4s;
}
#overlay.hidden { opacity: 0; pointer-events: none; }
#overlay h1 {
  font-size: 72px; font-weight: 900; color: #fff;
  text-shadow: 0 4px 20px rgba(0,0,0,0.25), 0 0 60px rgba(255,255,255,0.3);
  letter-spacing: 6px; margin-bottom: 16px;
}
#overlay .subtitle { font-size: 22px; color: rgba(255,255,255,0.9); margin-bottom: 30px; font-weight: 500; }
#overlay .final-score { font-size: 48px; color: #fff; font-weight: 800; margin-bottom: 10px; }
#overlay .restart-hint {
  font-size: 18px; color: #fff; animation: blink 1.2s ease-in-out infinite;
  margin-top: 20px; font-weight: 600;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
#overlay .controls-info { font-size: 14px; color: rgba(255,255,255,0.8); margin-top: 12px; }

@media (max-width: 600px) {
  .hud-item { padding: 8px 14px; font-size: 14px; border-radius: 12px; }
  #overlay h1 { font-size: 42px; letter-spacing: 3px; }
  #overlay .final-score { font-size: 36px; }
}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <h2>CITY RUSH</h2>
</div>

<div id="hud" style="display:none;">
  <div class="hud-item" id="hud-score">SCORE: 0</div>
  <div class="hud-item"><div class="coin-icon"></div><span id="hud-coins">0</span></div>
  <div class="hud-item" id="hud-speed">0 km/h</div>
</div>

<div id="overlay">
  <h1>CITY RUSH</h1>
  <div class="subtitle">Endless Runner</div>
  <div class="final-score" id="final-score" style="display:none;"></div>
  <div class="restart-hint">Нажми ПРОБЕЛ или тапни для старта</div>
  <div class="controls-info">← → смена полосы &nbsp;|&nbsp; ПРОБЕЛ — прыжок</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const state = {
  running: false,
  score: 0,
  coins: 0,
  speed: 0.3,
  maxSpeed: 0.9,
  speedIncrement: 0.00005,
  currentLane: 0,
  targetLane: 0,
  laneWidth: 3.0,
  isJumping: false,
  velocityY: 0,
  gravity: -0.025,
  jumpForce: 0.45,
  playerBaseY: 0,
  distanceTraveled: 0,
  gameOver: false,
  started: false
};

const LANE_POSITIONS = [-3, 0, 3];
const ROAD_SEGMENT_LENGTH = 40;
const NUM_ROAD_SEGMENTS = 6;
const SPAWN_DISTANCE = 180;

// ============ RENDERER ============
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ============ SCENE ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 80, 200);

// ============ CAMERA ============
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 6, 10);
camera.lookAt(0, 1, -10);

// ============ LIGHTING ============
const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x556b2f, 0.6);
scene.add(hemiLight);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff4e0, 1.8);
sunLight.position.set(10, 20, 5);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 100;
sunLight.shadow.camera.left = -25;
sunLight.shadow.camera.right = 25;
sunLight.shadow.camera.top = 25;
sunLight.shadow.camera.bottom = -25;
sunLight.shadow.bias = -0.001;
scene.add(sunLight);
scene.add(sunLight.target);

// ============ MATERIALS ============
const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
const whiteLineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
const yellowLineMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffaa00, emissiveIntensity: 0.3, roughness: 0.4 });
const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.8 });
const curbMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.7 });
const obstacleMat = new THREE.MeshStandardMaterial({ color: 0xff6600, roughness: 0.4, metalness: 0.1 });
const obstacleMat2 = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.4, metalness: 0.1 });
const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.5, metalness: 0.8, roughness: 0.2 });
const lampPoleMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.6, roughness: 0.4 });
const lampGlowMat = new THREE.MeshStandardMaterial({ color: 0xffee88, emissive: 0xffdd44, emissiveIntensity: 1.0 });

const buildingColors = [0xd4c5a9, 0xc8bfa0, 0xb8b0a0, 0xa8a098, 0xccc4b0, 0xe0d8c8, 0xbfb8a8, 0xd0c8b8];
const windowMat = new THREE.MeshStandardMaterial({ color: 0x88bbff, emissive: 0x4488cc, emissiveIntensity: 0.4, roughness: 0.1, metalness: 0.3 });

// ============ МАТЕРИАЛЫ ПЕРСОНАЖА ============
const lizardSkinMat = new THREE.MeshStandardMaterial({ color: 0x44cc44, roughness: 0.6 });
const lizardDarkMat = new THREE.MeshStandardMaterial({ color: 0x228822, roughness: 0.6 });
const jacketMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.2 });
const jacketAccentMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.4 });
const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
const eyePupilMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.1 });
const skateboardDeckMat = new THREE.MeshStandardMaterial({ color: 0xcc4400, roughness: 0.5 });
const skateboardWheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });

// ============ ПЕРСОНАЖ: ЯЩЕРКА-ЧИБИ В КУРТКЕ НА СКЕЙТЕ ============
let player = null;
let playerLoaded = false;

function createLizardBiker() {
  const group = new THREE.Group();

  // === СКЕЙТБОРД ===
  const skateboard = new THREE.Group();
  
  // Доска
  const deckGeo = new THREE.BoxGeometry(0.8, 0.08, 2.2);
  const deck = new THREE.Mesh(deckGeo, skateboardDeckMat);
  deck.position.y = 0.15;
  deck.castShadow = true;
  skateboard.add(deck);
  
  // Колёса
  const wheelGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.08, 16);
  const wheelPositions = [
    [-0.35, 0.08, -0.8],
    [0.35, 0.08, -0.8],
    [-0.35, 0.08, 0.8],
    [0.35, 0.08, 0.8]
  ];
  
  wheelPositions.forEach(pos => {
    const wheel = new THREE.Mesh(wheelGeo, skateboardWheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(...pos);
    wheel.castShadow = true;
    skateboard.add(wheel);
  });
  
  group.add(skateboard);

  // === ТЕЛО (в куртке) ===
  const bodyGeo = new THREE.CapsuleGeometry(0.35, 0.6, 8, 16);
  const body = new THREE.Mesh(bodyGeo, jacketMat);
  body.position.y = 0.9;
  body.castShadow = true;
  group.add(body);
  
  // Детали куртки: молния
  const zipperGeo = new THREE.BoxGeometry(0.05, 0.5, 0.02);
  const zipper = new THREE.Mesh(zipperGeo, metalMat);
  zipper.position.set(0, 0.9, 0.36);
  group.add(zipper);
  
  // Воротник
  const collarGeo = new THREE.TorusGeometry(0.3, 0.08, 8, 16, Math.PI);
  const collar = new THREE.Mesh(collarGeo, jacketAccentMat);
  collar.position.set(0, 1.25, 0);
  collar.rotation.x = Math.PI / 2;
  collar.castShadow = true;
  group.add(collar);

  // === РУКИ ===
  const armGeo = new THREE.CapsuleGeometry(0.12, 0.4, 6, 12);
  
  // Левая рука
  const leftArm = new THREE.Mesh(armGeo, jacketMat);
  leftArm.position.set(-0.45, 0.95, 0);
  leftArm.rotation.z = 0.3;
  leftArm.castShadow = true;
  group.add(leftArm);
  
  // Правая рука
  const rightArm = new THREE.Mesh(armGeo, jacketMat);
  rightArm.position.set(0.45, 0.95, 0);
  rightArm.rotation.z = -0.3;
  rightArm.castShadow = true;
  group.add(rightArm);
  
  // Кисти (зелёные)
  const handGeo = new THREE.SphereGeometry(0.1, 12, 12);
  const leftHand = new THREE.Mesh(handGeo, lizardSkinMat);
  leftHand.position.set(-0.55, 0.7, 0);
  leftHand.castShadow = true;
  group.add(leftHand);
  
  const rightHand = new THREE.Mesh(handGeo, lizardSkinMat);
  rightHand.position.set(0.55, 0.7, 0);
  rightHand.castShadow = true;
  group.add(rightHand);

  // === НОГИ (короткие, на скейте) ===
  const legGeo = new THREE.CapsuleGeometry(0.1, 0.25, 6, 12);
  
  const leftLeg = new THREE.Mesh(legGeo, lizardSkinMat);
  leftLeg.position.set(-0.2, 0.4, 0);
  leftLeg.castShadow = true;
  group.add(leftLeg);
  
  const rightLeg = new THREE.Mesh(legGeo, lizardSkinMat);
  rightLeg.position.set(0.2, 0.4, 0);
  rightLeg.castShadow = true;
  group.add(rightLeg);

  // === ГОЛОВА (большая, чиби-стиль) ===
  const headGeo = new THREE.SphereGeometry(0.5, 24, 24);
  const head = new THREE.Mesh(headGeo, lizardSkinMat);
  head.position.y = 1.7;
  head.scale.set(1, 0.9, 0.95);
  head.castShadow = true;
  group.add(head);
  
  // Морда (вытянутая)
  const snoutGeo = new THREE.SphereGeometry(0.25, 16, 16);
  const snout = new THREE.Mesh(snoutGeo, lizardSkinMat);
  snout.position.set(0, 1.6, 0.35);
  snout.scale.set(0.8, 0.6, 1);
  snout.castShadow = true;
  group.add(snout);
  
  // Ноздри
  const nostrilGeo = new THREE.SphereGeometry(0.04, 8, 8);
  const nostrilMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  const leftNostril = new THREE.Mesh(nostrilGeo, nostrilMat);
  leftNostril.position.set(-0.08, 1.6, 0.55);
  group.add(leftNostril);
  
  const rightNostril = new THREE.Mesh(nostrilGeo, nostrilMat);
  rightNostril.position.set(0.08, 1.6, 0.55);
  group.add(rightNostril);

  // === ГЛАЗА (большие, чиби) ===
  const eyeGeo = new THREE.SphereGeometry(0.15, 16, 16);
  const pupilGeo = new THREE.SphereGeometry(0.08, 12, 12);
  
  // Левый глаз
  const leftEye = new THREE.Mesh(eyeGeo, eyeWhiteMat);
  leftEye.position.set(-0.2, 1.8, 0.4);
  leftEye.castShadow = true;
  group.add(leftEye);
  
  const leftPupil = new THREE.Mesh(pupilGeo, eyePupilMat);
  leftPupil.position.set(-0.2, 1.8, 0.52);
  group.add(leftPupil);
  
  // Правый глаз
  const rightEye = new THREE.Mesh(eyeGeo, eyeWhiteMat);
  rightEye.position.set(0.2, 1.8, 0.4);
  rightEye.castShadow = true;
  group.add(rightEye);
  
  const rightPupil = new THREE.Mesh(pupilGeo, eyePupilMat);
  rightPupil.position.set(0.2, 1.8, 0.52);
  group.add(rightPupil);

  // === ХВОСТ ===
  const tailSegments = 5;
  let tailY = 0.7;
  let tailZ = -0.4;
  
  for (let i = 0; i < tailSegments; i++) {
    const tailGeo = new THREE.SphereGeometry(0.12 - i * 0.015, 12, 12);
    const tail = new THREE.Mesh(tailGeo, i % 2 === 0 ? lizardSkinMat : lizardDarkMat);
    tail.position.set(0, tailY - i * 0.1, tailZ - i * 0.15);
    tail.castShadow = true;
    group.add(tail);
  }

  // === ШИПЫ НА СПИНЕ (декор) ===
  const spikeGeo = new THREE.ConeGeometry(0.05, 0.15, 8);
  const spikeMat = new THREE.MeshStandardMaterial({ color: 0x228822, roughness: 0.5 });
  
  for (let i = 0; i < 3; i++) {
    const spike = new THREE.Mesh(spikeGeo, spikeMat);
    spike.position.set(0, 1.3 + i * 0.15, -0.35);
    spike.rotation.x = Math.PI;
    spike.castShadow = true;
    group.add(spike);
  }

  // Разворачиваем персонажа лицом вперёд (вдоль -Z)
  group.rotation.y = Math.PI;
  
  return group;
}

// Создаём персонажа
player = createLizardBiker();
const box = new THREE.Box3().setFromObject(player);
state.playerBaseY = -box.min.y;
player.position.set(0, state.playerBaseY, 0);
scene.add(player);
playerLoaded = true;

// ============ ROAD GENERATION ============
const roadSegments = [];
const obstacles = [];
const coinObjects = [];
const particles = [];

function createRoadSegment(zPos) {
  const group = new THREE.Group();
  group.position.z = zPos;

  const roadGeo = new THREE.PlaneGeometry(9, ROAD_SEGMENT_LENGTH);
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0;
  road.receiveShadow = true;
  group.add(road);

  for (let side of [-4.3, 4.3]) {
    const lineGeo = new THREE.PlaneGeometry(0.2, ROAD_SEGMENT_LENGTH);
    const line = new THREE.Mesh(lineGeo, whiteLineMat);
    line.rotation.x = -Math.PI / 2;
    line.position.set(side, 0.01, 0);
    group.add(line);
  }

  for (let lx of [-1.5, 1.5]) {
    for (let dz = -ROAD_SEGMENT_LENGTH / 2 + 1; dz < ROAD_SEGMENT_LENGTH / 2; dz += 3) {
      const dashGeo = new THREE.PlaneGeometry(0.15, 1.5);
      const dash = new THREE.Mesh(dashGeo, yellowLineMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(lx, 0.01, dz);
      group.add(dash);
    }
  }

  for (let side of [-1, 1]) {
    const swGeo = new THREE.BoxGeometry(4, 0.2, ROAD_SEGMENT_LENGTH);
    const sw = new THREE.Mesh(swGeo, sidewalkMat);
    sw.position.set(side * 6.5, 0.1, 0);
    sw.receiveShadow = true;
    sw.castShadow = true;
    group.add(sw);

    const curbGeo = new THREE.BoxGeometry(0.3, 0.3, ROAD_SEGMENT_LENGTH);
    const curb = new THREE.Mesh(curbGeo, curbMat);
    curb.position.set(side * 4.65, 0.15, 0);
    curb.castShadow = true;
    group.add(curb);
  }

  for (let side of [-1, 1]) {
    const numBuildings = 2 + Math.floor(Math.random() * 2);
    let currentZ = -ROAD_SEGMENT_LENGTH / 2;
    for (let i = 0; i < numBuildings; i++) {
      const bw = 4 + Math.random() * 5;
      const bh = 6 + Math.random() * 20;
      const bd = 4 + Math.random() * 6;
      const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
      const bMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 });

      const bGeo = new THREE.BoxGeometry(bw, bh, bd);
      const building = new THREE.Mesh(bGeo, bMat);
      building.position.set(side * (9 + bw / 2 + Math.random() * 2), bh / 2, currentZ + bd / 2);
      building.castShadow = true;
      building.receiveShadow = true;
      group.add(building);

      const windowRows = Math.floor(bh / 2.5);
      for (let row = 0; row < windowRows; row++) {
        const winGeo = new THREE.PlaneGeometry(bw * 0.8, 0.8);
        const win = new THREE.Mesh(winGeo, windowMat);
        win.position.set(building.position.x - side * (bw / 2 + 0.01), 1.5 + row * 2.5, building.position.z);
        win.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
        group.add(win);
      }
      currentZ += bd + 0.5 + Math.random() * 2;
      if (currentZ > ROAD_SEGMENT_LENGTH / 2) break;
    }
  }

  for (let side of [-1, 1]) {
    for (let lz = -ROAD_SEGMENT_LENGTH / 2 + 5; lz < ROAD_SEGMENT_LENGTH / 2; lz += 15) {
      const poleGeo = new THREE.CylinderGeometry(0.08, 0.1, 4, 8);
      const pole = new THREE.Mesh(poleGeo, lampPoleMat);
      pole.position.set(side * 5.0, 2, lz);
      pole.castShadow = true;
      group.add(pole);

      const armGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.2, 6);
      const arm = new THREE.Mesh(armGeo, lampPoleMat);
      arm.rotation.z = Math.PI / 2 * (-side);
      arm.position.set(side * 4.4, 3.9, lz);
      group.add(arm);

      const bulbGeo = new THREE.SphereGeometry(0.2, 8, 8);
      const bulb = new THREE.Mesh(bulbGeo, lampGlowMat);
      bulb.position.set(side * 4.0, 3.8, lz);
      group.add(bulb);
    }
  }

  scene.add(group);
  return { group, zPos };
}

function initRoad() {
  for (let i = 0; i < NUM_ROAD_SEGMENTS; i++) {
    roadSegments.push(createRoadSegment(-i * ROAD_SEGMENT_LENGTH));
  }
}

// ============ OBSTACLES & COINS ============
function spawnObstacle(z) {
  const lane = Math.floor(Math.random() * 3) - 1;
  const isHigh = Math.random() > 0.5;
  const h = isHigh ? 2.5 : 1.0;
  const geo = new THREE.BoxGeometry(1.8, h, 1.8);
  const mat = isHigh ? obstacleMat : obstacleMat2;
  const obs = new THREE.Mesh(geo, mat);
  obs.position.set(LANE_POSITIONS[lane + 1], h / 2, z);
  obs.castShadow = true;
  obs.receiveShadow = true;
  obs.userData = { lane, isHigh, type: 'obstacle' };
  scene.add(obs);
  obstacles.push(obs);
}

function spawnCoin(z) {
  const lane = Math.floor(Math.random() * 3) - 1;
  const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.12, 16);
  const coin = new THREE.Mesh(geo, coinMat);
  coin.position.set(LANE_POSITIONS[lane + 1], 1.5, z);
  coin.rotation.x = Math.PI / 2;
  coin.castShadow = true;
  coin.userData = { lane, type: 'coin', collected: false };
  scene.add(coin);
  coinObjects.push(coin);
}

let nextSpawnZ = -60;
function manageSpawns() {
  const playerZ = player ? player.position.z : 0;
  while (nextSpawnZ > playerZ - SPAWN_DISTANCE) {
    if (Math.random() > 0.3) spawnObstacle(nextSpawnZ);
    if (Math.random() > 0.4) spawnCoin(nextSpawnZ - 10);
    if (Math.random() > 0.6) spawnCoin(nextSpawnZ - 20);
    nextSpawnZ -= (12 + Math.random() * 10);
  }
}

// ============ PARTICLES ============
function spawnExplosion(pos) {
  const count = 30;
  for (let i = 0; i < count; i++) {
    const size = 0.1 + Math.random() * 0.2;
    const geo = new THREE.BoxGeometry(size, size, size);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.05 + Math.random() * 0.1, 1, 0.5 + Math.random() * 0.3)
    });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    p.userData.vel = new THREE.Vector3(
      (Math.random() - 0.5) * 0.4,
      Math.random() * 0.4 + 0.1,
      (Math.random() - 0.5) * 0.4
    );
    p.userData.life = 1.0;
    scene.add(p);
    particles.push(p);
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.vel.y -= 0.012;
    p.position.add(p.userData.vel);
    p.userData.life -= 0.02;
    p.material.opacity = p.userData.life;
    p.material.transparent = true;
    p.rotation.x += 0.1;
    p.rotation.z += 0.1;
    if (p.userData.life <= 0) {
      scene.remove(p);
      p.geometry.dispose();
      p.material.dispose();
      particles.splice(i, 1);
    }
  }
}

// ============ COLLISION ============
function checkCollisions() {
  if (!player) return;
  const pPos = player.position;
  const pBox = new THREE.Box3().setFromObject(player);

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    const oBox = new THREE.Box3().setFromObject(obs);
    pBox.expandByScalar(-0.2);
    if (pBox.intersectsBox(oBox)) {
      spawnExplosion(obs.position.clone());
      gameOver();
      return;
    }
  }

  for (let i = coinObjects.length - 1; i >= 0; i--) {
    const coin = coinObjects[i];
    if (coin.userData.collected) continue;
    const dist = pPos.distanceTo(coin.position);
    if (dist < 1.5) {
      coin.userData.collected = true;
      scene.remove(coin);
      coin.geometry.dispose();
      coinObjects.splice(i, 1);
      state.coins++;
      state.score += 50;
      document.getElementById('hud-coins').textContent = state.coins;
    }
  }
}

// ============ GAME FLOW ============
function gameOver() {
  state.running = false;
  state.gameOver = true;
  document.getElementById('final-score').textContent = `Счёт: ${state.score}`;
  document.getElementById('final-score').style.display = 'block';
  document.querySelector('#overlay .restart-hint').textContent = 'Нажми ПРОБЕЛ или тапни для рестарта';
  document.getElementById('overlay').classList.remove('hidden');
}

function restartGame() {
  for (const obs of obstacles) { scene.remove(obs); obs.geometry.dispose(); }
  obstacles.length = 0;
  for (const c of coinObjects) { scene.remove(c); c.geometry.dispose(); }
  coinObjects.length = 0;
  for (const p of particles) { scene.remove(p); p.geometry.dispose(); p.material.dispose(); }
  particles.length = 0;

  state.score = 0;
  state.coins = 0;
  state.speed = 0.3;
  state.currentLane = 0;
  state.targetLane = 0;
  state.isJumping = false;
  state.velocityY = 0;
  state.distanceTraveled = 0;
  state.gameOver = false;
  state.running = true;
  nextSpawnZ = -60;

  if (player) {
    player.position.set(0, state.playerBaseY, 0);
    player.rotation.y = Math.PI;
  }

  for (let i = 0; i < roadSegments.length; i++) {
    roadSegments[i].group.position.z = -i * ROAD_SEGMENT_LENGTH;
    roadSegments[i].zPos = -i * ROAD_SEGMENT_LENGTH;
  }

  document.getElementById('hud-score').textContent = 'SCORE: 0';
  document.getElementById('hud-coins').textContent = '0';
  document.getElementById('hud-speed').textContent = '0 km/h';
  document.getElementById('final-score').style.display = 'none';
  document.getElementById('overlay').classList.add('hidden');
}

function startGame() {
  if (!state.started) {
    state.started = true;
    state.running = true;
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('hud').style.display = 'flex';
    
    // Скрываем экран загрузки
    document.getElementById('loading-screen').classList.add('hidden');
  }
}

// ============ INPUT ============
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && state.running) {
    if (!state.isJumping && player) {
      state.isJumping = true;
      state.velocityY = state.jumpForce;
    }
  }
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
    if (state.running) state.targetLane = Math.max(-1, state.targetLane - 1);
  }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') {
    if (state.running) state.targetLane = Math.min(1, state.targetLane + 1);
  }
  if (e.code === 'Space' && !state.running && state.started) {
    restartGame();
  }
  if (e.code === 'Space' && !state.started) {
    startGame();
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  if (!state.started) { startGame(); return; }
  if (!state.running && state.gameOver) { restartGame(); return; }
}, { passive: true });

window.addEventListener('touchend', (e) => {
  if (!state.running) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);

  if (absDx > absDy && absDx > 30) {
    if (dx > 0) state.targetLane = Math.min(1, state.targetLane + 1);
    else state.targetLane = Math.max(-1, state.targetLane - 1);
  } else if (absDy > 30 && dy < 0) {
    if (!state.isJumping && player) {
      state.isJumping = true;
      state.velocityY = state.jumpForce;
    }
  }
}, { passive: true });

document.getElementById('overlay').addEventListener('click', () => {
  if (!state.started) startGame();
  else if (state.gameOver) restartGame();
});

// ============ RESIZE ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ INIT ============
initRoad();

// ============ ANIMATION LOOP ============
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (state.running && player) {
    state.speed = Math.min(state.maxSpeed, state.speed + state.speedIncrement);
    state.distanceTraveled += state.speed;
    state.score = Math.floor(state.distanceTraveled * 2) + state.coins * 50;

    player.position.z -= state.speed;

    const targetX = LANE_POSITIONS[state.targetLane + 1];
    player.position.x += (targetX - player.position.x) * 0.12;
    const leanTarget = (targetX - player.position.x) * 0.3;
    player.rotation.z += (leanTarget - player.rotation.z) * 0.1;

    if (state.isJumping) {
      state.velocityY += state.gravity;
      player.position.y += state.velocityY;
      if (player.position.y <= state.playerBaseY) {
        player.position.y = state.playerBaseY;
        state.isJumping = false;
        state.velocityY = 0;
      }
    }

    const playerZ = player.position.z;
    for (const seg of roadSegments) {
      if (seg.group.position.z > playerZ + ROAD_SEGMENT_LENGTH) {
        seg.group.position.z -= NUM_ROAD_SEGMENTS * ROAD_SEGMENT_LENGTH;
        seg.zPos = seg.group.position.z;
      }
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      if (obstacles[i].position.z > playerZ + 30) {
        scene.remove(obstacles[i]);
        obstacles[i].geometry.dispose();
        obstacles.splice(i, 1);
      }
    }
    for (let i = coinObjects.length - 1; i >= 0; i--) {
      if (coinObjects[i].position.z > playerZ + 30) {
        scene.remove(coinObjects[i]);
        coinObjects[i].geometry.dispose();
        coinObjects.splice(i, 1);
      }
    }

    manageSpawns();

    for (const coin of coinObjects) {
      coin.rotation.z += 0.05;
    }

    checkCollisions();

    const camTargetX = player.position.x * 0.4;
    const camTargetZ = player.position.z + 10;
    camera.position.x += (camTargetX - camera.position.x) * 0.05;
    camera.position.z += (camTargetZ - camera.position.z) * 0.08;
    camera.position.y = 6 + (player.position.y - state.playerBaseY) * 0.3;
    camera.lookAt(player.position.x * 0.5, 1.5, player.position.z - 10);

    sunLight.position.set(player.position.x + 10, 20, player.position.z + 5);
    sunLight.target.position.set(player.position.x, 0, player.position.z - 5);

    document.getElementById('hud-score').textContent = `SCORE: ${state.score}`;
    document.getElementById('hud-speed').textContent = `${Math.floor(state.speed * 120)} km/h`;
  }

  updateParticles();
  renderer.render(scene, camera);
}

animate();
</script>
