<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

// --- Game State ---
const state = {
    gameState: 'LOADING', // LOADING, START, PLAYING, GAMEOVER
    score: 0,
    coins: 0,
    speed: 15, // initial speed
    maxSpeed: 40,
    lane: 1, // 0: left, 1: center, 2: right
    targetX: 0,
    playerBaseY: 0,
    velocityY: 0,
    isJumping: false,
    distance: 0,
    time: 0
};

const LANE_WIDTH = 3.5;
const GRAVITY = 40;
const JUMP_FORCE = 15;

// --- Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 20, 90);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// --- Lighting ---
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
scene.add(hemiLight);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff0dd, 1.2);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 100;
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
scene.add(dirLight);
scene.add(dirLight.target);

// --- Materials ---
const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
const whiteLineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
const yellowLineMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0xffaa00, emissiveIntensity: 0.5, roughness: 0.5 });
const curbMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.8 });
const buildingMats = [
    new THREE.MeshStandardMaterial({ color: 0xd4c5b0, roughness: 0.7 }),
    new THREE.MeshStandardMaterial({ color: 0xb8b0a8, roughness: 0.7 }),
    new THREE.MeshStandardMaterial({ color: 0xe0d8cc, roughness: 0.7 })
];

// Procedural Window Texture
function createWindowTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#999999';
    ctx.fillRect(0, 0, 64, 128);
    ctx.fillStyle = '#aaddff';
    ctx.shadowColor = '#88ccff';
    ctx.shadowBlur = 8;
    for (let y = 8; y < 128; y += 16) {
        ctx.fillRect(4, y, 56, 6);
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1, 4);
    return tex;
}
const windowTex = createWindowTexture();
const buildingWindowMat = new THREE.MeshStandardMaterial({ 
    map: windowTex, emissive: 0x88ccff, emissiveMap: windowTex, emissiveIntensity: 0.8 
});

const obstacleMatLow = new THREE.MeshStandardMaterial({ color: 0xff8800, roughness: 0.4 });
const obstacleMatHigh = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.4 });
const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2, emissive: 0xffaa00, emissiveIntensity: 0.4 });

// --- Player ---
let player = new THREE.Group();
let mixer = null;
let playerMesh = null;

function initPlayer() {
    return new Promise((resolve) => {
        const loader = new GLTFLoader();
        loader.load(
            'player_game.glb',
            (gltf) => {
                playerMesh = gltf.scene;
                playerMesh.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                player.add(playerMesh);
                
                // Scale to ~2.0 units height
                const box = new THREE.Box3().setFromObject(playerMesh);
                const height = box.max.y - box.min.y;
                const scale = 2.0 / height;
                playerMesh.scale.setScalar(scale);
                
                // Recalculate box after scaling
                const box2 = new THREE.Box3().setFromObject(playerMesh);
                state.playerBaseY = -box2.min.y;
                player.position.y = state.playerBaseY;
                
                // Face forward (-Z)
                player.rotation.y = Math.PI;
                
                // Animation
                if (gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(playerMesh);
                    const clip = gltf.animations.find(a => a.name.match(/run|walk/i)) || gltf.animations[0];
                    const action = mixer.clipAction(clip);
                    action.play();
                }
                
                scene.add(player);
                resolve();
            },
            undefined,
            (error) => {
                console.warn("GLTF load failed, using fallback capsule:", error);
                const geo = new THREE.CapsuleGeometry(0.5, 1.0, 4, 8);
                const mat = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.3, metalness: 0.1 });
                playerMesh = new THREE.Mesh(geo, mat);
                playerMesh.castShadow = true;
                playerMesh.receiveShadow = true;
                player.add(playerMesh);
                
                // Capsule height is 1.0 + 2*0.5 = 2.0. Min Y is -1.0 relative to center.
                state.playerBaseY = 1.0;
                player.position.y = state.playerBaseY;
                player.rotation.y = Math.PI;
                
                scene.add(player);
                resolve();
            }
        );
    });
}

// --- Environment Pools ---
const roadSegments = [];
const buildings = [];
const streetlights = [];
const obstacles = [];
const coins = [];
const particles = [];

const SEGMENT_LENGTH = 20;
const SEGMENT_COUNT = 15;

function createRoadSegment(zPos) {
    const group = new THREE.Group();
    
    // Asphalt
    const asphalt = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, SEGMENT_LENGTH), asphaltMat);
    asphalt.position.y = -0.1;
    asphalt.receiveShadow = true;
    group.add(asphalt);
    
    // White edge lines
    const leftLine = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, SEGMENT_LENGTH), whiteLineMat);
    leftLine.position.set(-4.9, 0.01, 0);
    leftLine.receiveShadow = true;
    group.add(leftLine);
    
    const rightLine = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, SEGMENT_LENGTH), whiteLineMat);
    rightLine.position.set(4.9, 0.01, 0);
    rightLine.receiveShadow = true;
    group.add(rightLine);
    
    // Yellow dashed lines
    for (let z = -SEGMENT_LENGTH/2 + 1; z < SEGMENT_LENGTH/2; z += 4) {
        const dash1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 2), yellowLineMat);
        dash1.position.set(-1.75, 0.01, z);
        group.add(dash1);
        
        const dash2 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 2), yellowLineMat);
        dash2.position.set(1.75, 0.01, z);
        group.add(dash2);
    }
    
    // Sidewalks & Curbs
    const leftCurb = new THREE.Mesh(new THREE.BoxGeometry(1, 0.3, SEGMENT_LENGTH), curbMat);
    leftCurb.position.set(-5.5, 0.05, 0);
    leftCurb.receiveShadow = true;
    group.add(leftCurb);
    
    const rightCurb = new THREE.Mesh(new THREE.BoxGeometry(1, 0.3, SEGMENT_LENGTH), curbMat);
    rightCurb.position.set(5.5, 0.05, 0);
    rightCurb.receiveShadow = true;
    group.add(rightCurb);
    
    group.position.z = zPos;
    scene.add(group);
    return group;
}

function createBuilding(zPos, side) {
    const group = new THREE.Group();
    const width = 4 + Math.random() * 6;
    const depth = 4 + Math.random() * 6;
    const height = 10 + Math.random() * 30;
    
    const matIndex = Math.floor(Math.random() * buildingMats.length);
    const mainMesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), buildingMats[matIndex]);
    mainMesh.position.y = height / 2;
    mainMesh.castShadow = true;
    mainMesh.receiveShadow = true;
    group.add(mainMesh);
    
    // Windows
    const winMesh = new THREE.Mesh(new THREE.BoxGeometry(width + 0.1, height, depth + 0.1), buildingWindowMat);
    winMesh.position.y = height / 2;
    group.add(winMesh);
    
    const xPos = side === 'left' ? -10 - Math.random() * 5 : 10 + Math.random() * 5;
    group.position.set(xPos, 0, zPos);
    scene.add(group);
    return group;
}

function createStreetlight(zPos, side) {
    const group = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6), new THREE.MeshStandardMaterial({color: 0x444444}));
    pole.position.y = 3;
    pole.castShadow = true;
    group.add(pole);
    
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshStandardMaterial({color: 0xffffaa, emissive: 0xffaa00, emissiveIntensity: 1}));
    lamp.position.y = 6;
    group.add(lamp);
    
    const xPos = side === 'left' ? -6.5 : 6.5;
    group.position.set(xPos, 0, zPos);
    scene.add(group);
    return group;
}

function createObstacle(zPos, lane) {
    const isHigh = Math.random() > 0.5;
    const width = 2;
    const depth = 2;
    const height = isHigh ? 3.5 : 1.0;
    const yPos = isHigh ? state.playerBaseY + 1.5 : state.playerBaseY + height/2; // High is floating/wide, low is on ground
    
    const geo = new THREE.BoxGeometry(width, height, depth);
    const mat = isHigh ? obstacleMatHigh : obstacleMatLow;
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set((lane - 1) * LANE_WIDTH, yPos, zPos);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData = { type: 'obstacle', width, height, depth, lane };
    scene.add(mesh);
    return mesh;
}

function createCoin(zPos, lane) {
    const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
    const mesh = new THREE.Mesh(geo, coinMat);
    mesh.rotation.x = Math.PI / 2;
    mesh.position.set((lane - 1) * LANE_WIDTH, state.playerBaseY + 1.5, zPos);
    mesh.castShadow = true;
    mesh.userData = { type: 'coin', active: true };
    scene.add(mesh);
    return mesh;
}

function spawnParticles(pos) {
    for (let i = 0; i < 30; i++) {
        const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff4400, emissiveIntensity: 0.5 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        mesh.position.x += (Math.random() - 0.5) * 2;
        mesh.position.y += (Math.random() - 0.5) * 2;
        mesh.position.z += (Math.random() - 0.5) * 2;
        
        const vel = new THREE.Vector3(
            (Math.random() - 0.5) * 10,
            Math.random() * 10 + 5,
            (Math.random() - 0.5) * 10
        );
        
        scene.add(mesh);
        particles.push({ mesh, vel, life: 1.0 });
    }
}

// --- Initialization ---
async function initWorld() {
    for (let i = 0; i < SEGMENT_COUNT; i++) {
        const z = -i * SEGMENT_LENGTH;
        roadSegments.push(createRoadSegment(z));
        
        if (Math.random() > 0.3) buildings.push(createBuilding(z, 'left'));
        if (Math.random() > 0.3) buildings.push(createBuilding(z, 'right'));
        if (Math.random() > 0.7) streetlights.push(createStreetlight(z, 'left'));
        if (Math.random() > 0.7) streetlights.push(createStreetlight(z, 'right'));
        
        if (i > 3) { // Don't spawn immediately in front
            if (Math.random() > 0.6) {
                const lane = Math.floor(Math.random() * 3);
                obstacles.push(createObstacle(z, lane));
            } else if (Math.random() > 0.4) {
                const lane = Math.floor(Math.random() * 3);
                coins.push(createCoin(z, lane));
            }
        }
    }
}

async function init() {
    await initPlayer();
    await initWorld();
    
    document.getElementById('loading-screen').style.opacity = 0;
    setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
        state.gameState = 'START';
        updateUI();
    }, 500);
    
    window.addEventListener('resize', onWindowResize);
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('touchstart', onTouchStart, {passive: false});
    window.addEventListener('touchend', onTouchEnd, {passive: false});
    
    animate();
}

// --- Input Handling ---
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

function onKeyDown(e) {
    if (e.code === 'Space') {
        e.preventDefault();
        handleAction();
    } else if (state.gameState === 'PLAYING') {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
        if (e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
        if (e.code === 'ArrowUp' || e.code === 'KeyW') jump();
    }
}

function onTouchStart(e) {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
    touchStartTime = Date.now();
}

function onTouchEnd(e) {
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    const dt = Date.now() - touchStartTime;
    
    if (dt < 200 && Math.abs(dx) < 10 && Math.abs(dy) < 10) {
        handleAction(); // Tap
    } else if (state.gameState === 'PLAYING') {
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
            changeLane(dx > 0 ? 1 : -1);
        } else if (dy < -30) {
            jump();
        }
    }
}

function handleAction() {
    if (state.gameState === 'START' || state.gameState === 'GAMEOVER') {
        resetGame();
    }
}

function changeLane(dir) {
    const newLane = state.lane + dir;
    if (newLane >= 0 && newLane <= 2) {
        state.lane = newLane;
        state.targetX = (state.lane - 1) * LANE_WIDTH;
    }
}

function jump() {
    if (!state.isJumping) {
        state.velocityY = JUMP_FORCE;
        state.isJumping = true;
    }
}

function resetGame() {
    state.gameState = 'PLAYING';
    state.score = 0;
    state.coins = 0;
    state.speed = 15;
    state.lane = 1;
    state.targetX = 0;
    state.distance = 0;
    state.velocityY = 0;
    state.isJumping = false;
    
    player.position.set(0, state.playerBaseY, 0);
    player.rotation.z = 0;
    
    // Reset objects
    [...obstacles, ...coins].forEach(obj => scene.remove(obj));
    obstacles.length = 0;
    coins.length = 0;
    
    for (let i = 0; i < SEGMENT_COUNT; i++) {
        const z = -i * SEGMENT_LENGTH;
        if (i > 3) {
            if (Math.random() > 0.6) obstacles.push(createObstacle(z, Math.floor(Math.random() * 3)));
            else if (Math.random() > 0.4) coins.push(createCoin(z, Math.floor(Math.random() * 3)));
        }
    }
    
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('final-score').style.display = 'none';
}

function gameOver() {
    state.gameState = 'GAMEOVER';
    spawnParticles(player.position);
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('overlay-subtitle').textContent = 'Игра окончена';
    document.getElementById('final-score').textContent = `Счет: ${Math.floor(state.score)} | Монеты: ${state.coins}`;
    document.getElementById('final-score').style.display = 'block';
    document.querySelector('.blink').textContent = 'Нажми ПРОБЕЛ или тапни для рестарта';
}

// --- Game Loop ---
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    
    const delta = Math.min(clock.getDelta(), 0.1);
    state.time += delta;
    
    if (mixer && state.gameState === 'PLAYING') {
        mixer.update(delta);
    }
    
    if (state.gameState === 'PLAYING') {
        // Speed progression
        state.speed = Math.min(state.maxSpeed, state.speed + delta * 0.5);
        state.distance += state.speed * delta;
        state.score = state.distance + state.coins * 50;
        
        // Player movement
        player.position.z -= state.speed * delta;
        player.position.x += (state.targetX - player.position.x) * 10 * delta;
        
        // Tilt effect
        const tilt = (player.position.x - state.targetX) * 0.1;
        player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, tilt, 5 * delta);
        
        // Jump physics
        if (state.isJumping) {
            state.velocityY -= GRAVITY * delta;
            player.position.y += state.velocityY * delta;
            if (player.position.y <= state.playerBaseY) {
                player.position.y = state.playerBaseY;
                state.velocityY = 0;
                state.isJumping = false;
            }
        }
        
        // Camera follow
        const targetCamX = player.position.x * 0.5;
        camera.position.x += (targetCamX - camera.position.x) * 5 * delta;
        camera.position.z = player.position.z + 8;
        camera.position.y = player.position.y + 5;
        camera.lookAt(player.position.x, player.position.y + 1, player.position.z - 5);
        
        // Sun follow
        dirLight.position.set(player.position.x + 10, 20, player.position.z + 10);
        dirLight.target.position.copy(player.position);
        dirLight.target.updateMatrixWorld();
        
        // Recycle environment
        const playerZ = player.position.z;
        const recycleZ = playerZ + 30;
        const spawnZ = playerZ - 150;
        
        roadSegments.forEach(seg => {
            if (seg.position.z > recycleZ) {
                seg.position.z = spawnZ - Math.random() * 10;
            }
        });
        
        buildings.forEach(b => {
            if (b.position.z > recycleZ) {
                b.position.z = spawnZ - Math.random() * 20;
                const side = Math.random() > 0.5 ? 'left' : 'right';
                b.position.x = side === 'left' ? -10 - Math.random() * 5 : 10 + Math.random() * 5;
            }
        });
        
        streetlights.forEach(sl => {
            if (sl.position.z > recycleZ) {
                sl.position.z = spawnZ - Math.random() * 20;
            }
        });
        
        // Recycle obstacles & coins
        for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            if (obs.position.z > recycleZ) {
                scene.remove(obs);
                obstacles.splice(i, 1);
                obstacles.push(createObstacle(spawnZ - Math.random() * 20, Math.floor(Math.random() * 3)));
            }
        }
        
        for (let i = coins.length - 1; i >= 0; i--) {
            const coin = coins[i];
            if (coin.position.z > recycleZ || !coin.userData.active) {
                scene.remove(coin);
                coins.splice(i, 1);
                if (coin.userData.active) { // was collected
                    // already handled
                } else {
                    coins.push(createCoin(spawnZ - Math.random() * 20, Math.floor(Math.random() * 3)));
                }
            } else {
                coin.rotation.y += 3 * delta;
            }
        }
        
        // Collisions
        const playerBox = new THREE.Box3().setFromObject(player);
        // Shrink player box slightly for forgiving gameplay
        playerBox.expandByScalar(-0.2);
        
        for (const obs of obstacles) {
            const obsBox = new THREE.Box3().setFromObject(obs);
            if (playerBox.intersectsBox(obsBox)) {
                gameOver();
                break;
            }
        }
        
        for (const coin of coins) {
            if (!coin.userData.active) continue;
            const coinBox = new THREE.Box3().setFromObject(coin);
            if (playerBox.intersectsBox(coinBox)) {
                coin.userData.active = false;
                state.coins++;
                scene.remove(coin);
                // Visual feedback could go here
            }
        }
        
        updateUI();
    }
    
    // Particles update (even in game over)
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vel.y -= GRAVITY * delta;
        p.mesh.position.addScaledVector(p.vel, delta);
        p.mesh.rotation.x += delta * 5;
        p.mesh.rotation.y += delta * 3;
        p.life -= delta;
        p.mesh.material.opacity = p.life;
        p.mesh.material.transparent = true;
        
        if (p.life <= 0) {
            scene.remove(p.mesh);
            particles.splice(i, 1);
        }
    }
    
    renderer.render(scene, camera);
}

function updateUI() {
    document.getElementById('score-val').textContent = Math.floor(state.score);
    document.getElementById('coin-val').textContent = state.coins;
    document.getElementById('speed-val').textContent = Math.floor(state.speed * 3); // fake km/h
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// Start
init();
</script>
